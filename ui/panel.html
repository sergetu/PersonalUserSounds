<!DOCTYPE html>
<html lang="ru" data-puss-preview="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PersonalUserSounds UI — preview / diagnostics</title>
<!--
  ============================================================================
  PersonalUserSounds — UI layer (single source of truth for the plugin's
  visual part). Three ways this file is used:

  1. BROWSER PREVIEW / DIAGNOSTICS:
     Open this file directly in a browser. The mock section below boots PussUI
     against demo data: switch locale (ru/en), theme (dark/light), open every
     view. No BetterDiscord required.

  2. BUILD (tools/build.js):
     The shared style block, every template block (ids puss-tpl-*) and the
     script section between __PUSS_GLUE_BEGIN__/__PUSS_GLUE_END__ are
     extracted and inlined into the final .plugin.js. PussUI then runs against
     the real Discord DOM, inheriting the real theme via var(--...) variables.
     NOTE: do not spell out real tag names of the extracted blocks in this
     comment — the builder's extractors match on literal tag strings.

  3. STYLING RULE:
     CSS uses Discord variables (var(--background-secondary), ...) with neutral
     fallbacks. In Discord the variables are inherited from the app root, so no
     global overrides are ever written (that would break the user's theme).
     In the browser the [data-puss-preview] attribute on <html> provides the
     palette below.
  ============================================================================
-->
<style id="puss-styles">
/* ===== Palette for browser preview only (never present inside Discord) ===== */
:root[data-puss-preview="dark"] {
    --background-primary: #313338; --background-secondary: #2b2d31;
    --background-secondary-alt: #292b2f; --background-tertiary: #1e1f22;
    --background-floating: #2b2d31; --background-modifier-hover: rgba(255,255,255,.06);
    --background-modifier-accent: rgba(255,255,255,.06); --input-background: #1e1f22;
    --text-normal: #dbdee1; --text-muted: #949ba4; --text-link: #00a8fc;
    --header-primary: #f2f3f5; --interactive-normal: #b5bac1;
    --interactive-hover: #dbdee1; --interactive-active: #f2f3f5;
    --brand-experiment: #5865f2; --status-danger: #f23f43; --status-positive: #23a55a;
    --puss-overlay-bg: rgba(0,0,0,.6); --puss-shadow: 0 8px 40px rgba(0,0,0,.4);
    --puss-card-bg: transparent; --puss-track: rgba(255,255,255,.08);
    --scrollbar-thin-thumb: rgba(255,255,255,.32); --scrollbar-thin-track: transparent;
}
:root[data-puss-preview="light"] {
    --background-primary: #ffffff; --background-secondary: #f2f3f5;
    --background-secondary-alt: #ebedef; --background-tertiary: #e3e5e8;
    --background-floating: #ffffff; --background-modifier-hover: rgba(0,0,0,.05);
    --background-modifier-accent: rgba(0,0,0,.08); --input-background: #e3e5e8;
    --text-normal: #313338; --text-muted: #5c5e66; --text-link: #0067e0;
    --header-primary: #060607; --interactive-normal: #4e5058;
    --interactive-hover: #2e3036; --interactive-active: #060607;
    --brand-experiment: #5865f2; --status-danger: #d83c3e; --status-positive: #248046;
    --puss-overlay-bg: rgba(0,0,0,.5); --puss-shadow: 0 8px 40px rgba(0,0,0,.16);
    --puss-card-bg: transparent; --puss-track: rgba(0,0,0,.1);
    --scrollbar-thin-thumb: rgba(0,0,0,.28); --scrollbar-thin-track: transparent;
}

/* ===== Scope ===== */
.puss, .puss * { box-sizing: border-box; }
.puss {
    color: var(--text-normal, #dbdee1);
    font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.4; max-width: 920px;
    padding: 16px;
}
.puss button { font-family: inherit; }
.puss-panel-host:empty { display: none; }

/* ===== Sections ===== */
.puss-section { margin-bottom: 24px; }
.puss-section-title {
    text-transform: uppercase; font-size: 12px; font-weight: 700;
    letter-spacing: .02em; color: var(--text-muted, #949ba4); margin: 0 0 12px;
    display: flex; align-items: center; gap: 8px;
}
.puss-hint { color: var(--text-muted, #949ba4); font-size: 12px; margin: -6px 0 12px; }

/* ===== Rows & fields ===== */
.puss-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--background-modifier-accent, rgba(255,255,255,.06));
}
.puss-row:last-child { border-bottom: none; }
.puss-row-label { font-weight: 500; }
.puss-row .puss-select { flex: 0 1 320px; }
.puss-field { margin: 0 0 10px; }
.puss-field:last-child { margin-bottom: 0; }
.puss-field-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 12px; }
.puss-field-label { font-size: 12px; font-weight: 600; color: var(--text-muted, #949ba4); text-transform: uppercase; letter-spacing: .02em; }
.puss-range-value { font-size: 13px; font-weight: 600; color: var(--interactive-active, #f2f3f5); font-variant-numeric: tabular-nums; }

/* ===== Inputs ===== */
.puss-input, .puss-select {
    width: 100%; padding: 8px 10px; border-radius: 4px;
    background: var(--input-background, #1e1f22);
    color: var(--text-normal, #dbdee1);
    border: 1px solid transparent; outline: none;
}
.puss-input:focus, .puss-select:focus { border-color: var(--brand-experiment, #5865f2); }
.puss-input::placeholder { color: var(--text-muted, #949ba4); }
.puss-input-number { width: 140px; }
.puss-select { cursor: pointer; }

/* ===== Range slider ===== */
.puss-range {
    -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
    border-radius: 2px; outline: none; cursor: pointer;
    background: var(--puss-track, rgba(255,255,255,.08));
}
.puss-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--interactive-active, #f2f3f5); border: none; cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.35); margin-top: 0;
}
.puss-range::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--interactive-active, #f2f3f5); border: none; cursor: pointer;
}

/* ===== Buttons ===== */
.puss-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 14px; border-radius: 4px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--interactive-normal, #b5bac1);
    background: var(--background-secondary-alt, #292b2f);
    transition: background-color .12s ease, color .12s ease;
}
.puss-btn:hover { color: var(--interactive-hover, #dbdee1); background: var(--background-modifier-hover, rgba(255,255,255,.06)); }
.puss-btn-sm { padding: 4px 10px; font-size: 12px; }
.puss-btn-primary { background: var(--brand-experiment, #5865f2); color: #fff; }
.puss-btn-primary:hover { background: var(--brand-experiment, #5865f2); filter: brightness(1.08); color: #fff; }
.puss-btn-danger { background: transparent; color: var(--status-danger, #f23f43); border: 1px solid var(--background-modifier-accent, rgba(255,255,255,.06)); }
.puss-btn-danger:hover { background: var(--status-danger, #f23f43); color: #fff; }
.puss-btn:disabled { opacity: .5; cursor: not-allowed; }
.puss-btn-row { display: flex; flex-wrap: wrap; gap: 6px; }

/* ===== Switch ===== */
.puss-switch { position: relative; display: inline-block; width: 44px; height: 24px; flex: 0 0 auto; }
.puss-switch-input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 2; }
.puss-switch-slider { position: absolute; inset: 0; border-radius: 12px; background: var(--puss-track, rgba(255,255,255,.08)); transition: background-color .15s ease; pointer-events: none; }
.puss-switch-slider::before {
    content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--interactive-normal, #b5bac1);
    transition: transform .15s ease, background-color .15s ease;
}
.puss-switch-input:checked + .puss-switch-slider { background: var(--brand-experiment, #5865f2); }
.puss-switch-input:checked + .puss-switch-slider::before { transform: translateX(20px); background: #fff; }
.puss-switch-input:focus-visible + .puss-switch-slider { box-shadow: 0 0 0 2px var(--background-primary, #313338), 0 0 0 4px var(--brand-experiment, #5865f2); }

/* ===== Event cards ===== */
.puss-event-list { display: grid; gap: 10px; }
.puss-event-list-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.puss-card {
    border: 1px solid var(--background-modifier-accent, rgba(255,255,255,.06));
    border-radius: 8px; padding: 12px 12px 14px; background: var(--puss-card-bg, transparent);
}
.puss-card-title { font-size: 14px; font-weight: 700; color: var(--header-primary, #f2f3f5); margin-bottom: 10px; display: block; }
.puss-card-title .puss-card-sub { font-weight: 400; font-size: 12px; color: var(--text-muted, #949ba4); margin-left: 6px; }

/* ===== Users list ===== */
.puss-empty { color: var(--text-muted, #949ba4); font-size: 13px; padding: 12px 0; }
.puss-add-row { display: flex; gap: 8px; margin-bottom: 12px; }
.puss-add-row .puss-input { flex: 1; min-width: 180px; }
.puss-user {
    display: grid; grid-template-columns: 40px minmax(140px, 1fr) minmax(200px, 1.4fr) auto;
    gap: 12px; align-items: center; padding: 10px;
    border: 1px solid var(--background-modifier-accent, rgba(255,255,255,.06)); border-radius: 8px; margin-bottom: 8px;
}
.puss-user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--background-secondary, #2b2d31); object-fit: cover; }
.puss-user-name { font-weight: 600; color: var(--header-primary, #f2f3f5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.puss-user-id { font-size: 12px; color: var(--text-muted, #949ba4); }
.puss-user-summary { font-size: 12px; color: var(--text-muted, #949ba4); line-height: 1.5; }
.puss-user-actions { display: flex; gap: 6px; justify-content: flex-end; }

/* ===== Modal ===== */
.puss-overlay {
    position: fixed; inset: 0; z-index: 100000;
    background: var(--puss-overlay-bg, rgba(0,0,0,.6));
    display: flex; align-items: center; justify-content: center; padding: 24px;
    animation: puss-fade .12s ease;
}
.puss-modal {
    background: var(--background-floating, #2b2d31);
    border-radius: 8px; border: 1px solid var(--background-modifier-accent, rgba(255,255,255,.08));
    box-shadow: var(--puss-shadow, 0 12px 48px rgba(0,0,0,.55));
    width: 620px; max-width: 100%; max-height: min(720px, calc(100vh - 48px));
    display: flex; flex-direction: column; overflow: hidden;
    animation: puss-pop .14s ease;
}
.puss-modal-sm { width: 480px; }
.puss-modal-header {
    padding: 16px 16px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    flex: 0 0 auto;
}
.puss-modal-title { margin: 0; font-size: 20px; font-weight: 700; color: var(--header-primary, #f2f3f5); line-height: 1.2; }
.puss-modal-body { padding: 16px; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.puss-modal-footer {
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    border-top: 1px solid var(--background-modifier-accent, rgba(255,255,255,.06));
    flex: 0 0 auto;
}
.puss-modal-footer .puss-btn-group { display: flex; gap: 8px; margin-left: auto; }

/* Thin Discord-style scrollbars inside the plugin UI (overlay/modal/panel).
   In Discord the theme variables are inherited; the preview palettes below
   define the same names, so one rule works in both environments. */
.puss ::-webkit-scrollbar,
.puss-modal ::-webkit-scrollbar {
    width: 8px; height: 8px;
}
.puss ::-webkit-scrollbar-track,
.puss ::-webkit-scrollbar-track-piece,
.puss-modal ::-webkit-scrollbar-track,
.puss-modal ::-webkit-scrollbar-track-piece {
    background: transparent;
    border: none;
}
.puss ::-webkit-scrollbar-thumb,
.puss-modal ::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thin-thumb, rgba(255,255,255,.28));
    border-radius: 4px;
}
.puss ::-webkit-scrollbar-corner,
.puss-modal ::-webkit-scrollbar-corner {
    background: transparent;
}

/* ===== BD host overrides =====
   When BetterDiscord opens this plugin's settings from the plugin list it wraps
   the panel in its own modal (.bd-modal-root.bd-modal-medium, ~600px). Widen it
   so the panel gets room to breathe. :has() scopes this to BD modals that host
   our panel only; preview mode has no .bd-* classes, so this is inert there. */
.bd-modal-root:has(.puss-panel-host) {
    width: min(1000px, calc(100vw - 120px)) !important;
    max-width: calc(100vw - 120px) !important;
    height: min(85vh, 940px) !important;
    max-height: calc(100vh - 120px) !important;
}
.bd-modal-root:has(.puss-panel-host) .bd-modal-content {
    width: auto !important;
}
@keyframes puss-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes puss-pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }

/* user modal head */
.puss-user-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.puss-avatar-lg { width: 48px; height: 48px; border-radius: 50%; background: var(--background-secondary, #2b2d31); object-fit: cover; flex: 0 0 auto; }
.puss-user-head-meta { flex: 1; min-width: 0; }
.puss-user-name-lg { font-weight: 700; color: var(--header-primary, #f2f3f5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.puss-btn-help {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--background-modifier-accent, rgba(255,255,255,.06));
    color: var(--interactive-normal, #b5bac1); background: var(--background-secondary, #2b2d31);
    cursor: pointer; font-weight: 700; flex: 0 0 auto; line-height: 1;
}
.puss-btn-help:hover { color: var(--interactive-hover, #dbdee1); }

/* Mode selector: four outline buttons. Active mode = white text, inactive = grey.
   Kept quiet: outline only, no fill. */
.puss-mode-btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 4px; }
.puss-mode-btn {
    padding: 4px 10px; font-size: 12px; border-radius: 4px; cursor: pointer;
    background: transparent; line-height: 1.4;
    border: 1px solid var(--background-modifier-accent, rgba(255,255,255,.08));
    color: var(--text-muted, #949ba4);
    transition: border-color .12s ease, color .12s ease;
}
.puss-mode-btn:hover { border-color: var(--interactive-normal, #b5bac1); color: var(--interactive-normal, #b5bac1); }
.puss-mode-btn.active { border-color: var(--interactive-active, #f2f3f5); color: var(--interactive-active, #f2f3f5); }
.puss-mode-btn:focus-visible { outline: 2px solid var(--brand-experiment, #5865f2); outline-offset: 1px; }

/* File path row: readonly path with ellipsis + "choose file" button beside it */
.puss-path-row { display: flex; gap: 6px; align-items: center; }
.puss-path-row .puss-input { flex: 1 1 auto; min-width: 0; }
.puss-path-row .puss-btn { flex: 0 0 auto; white-space: nowrap; }
.puss-input[readonly] { cursor: default; text-overflow: ellipsis; }
.puss-input[readonly]:focus { border-color: transparent; }

/* info rows (help / diagnostics / compatibility) */
.puss-diag-table { display: grid; gap: 4px; }
.puss-diag-row {
    display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: start;
    padding: 6px 0; border-bottom: 1px solid var(--background-modifier-accent, rgba(255,255,255,.06));
    font-size: 13px; word-break: break-all;
}
.puss-diag-row:last-child { border-bottom: none; }
.puss-diag-label { color: var(--text-muted, #949ba4); font-weight: 600; }
.puss-diag-value { color: var(--text-normal, #dbdee1); font-family: Consolas, "Courier New", monospace; font-size: 12px; white-space: pre-wrap; }
.puss-help-mode { font-weight: 700; color: var(--header-primary, #f2f3f5); }
.puss-compat-ok { color: var(--status-positive, #23a55a); font-weight: 700; }
.puss-compat-bad { color: var(--status-danger, #f23f43); font-weight: 700; }

/* ===== Browser preview toolbar (never injected into Discord) ===== */
.puss-preview-toolbar {
    position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 14px; margin-bottom: 14px; border-radius: 8px;
    background: var(--background-secondary, #2b2d31);
    border: 1px solid var(--background-modifier-accent, rgba(255,255,255,.06));
    font-size: 12px; color: var(--text-muted, #949ba4);
}
.puss-preview-toolbar .puss-btn { padding: 4px 10px; font-size: 12px; }
.puss-preview-stage { padding-bottom: 40px; }
.puss-preview-log {
    margin-top: 18px; padding: 10px; border-radius: 8px; max-height: 180px; overflow: auto;
    background: #111214; color: #b5bac1; font: 11px/1.5 Consolas, monospace; white-space: pre-wrap;
}
body.puss-preview-body { background: var(--background-primary, #313338); margin: 0; padding: 16px; min-height: 100vh; }
body.puss-preview-body .puss-panel-frame {
    border: 1px solid var(--background-modifier-accent, rgba(255,255,255,.06)); border-radius: 8px; margin-bottom: 12px;
}
@media (max-width: 720px) {
    .puss-user { grid-template-columns: 40px 1fr auto; }
    .puss-user-summary { display: none; }
}
</style>
</head>
<body class="puss-preview-body">

<!-- ======== Browser preview: toolbar + host stage + log ======== -->
<div class="puss-preview-toolbar" id="puss-toolbar">
    <strong>PersonalUserSounds UI</strong>
    <span class="puss-btn" data-pv="locale-ru" style="cursor:pointer">RU</span>
    <span class="puss-btn" data-pv="locale-en" style="cursor:pointer">EN</span>
    <span class="puss-btn" data-pv="theme" style="cursor:pointer">Theme</span>
    <span style="flex:1"></span>
    <span class="puss-btn" data-pv="open-panel" style="cursor:pointer">⟳ Panel</span>
    <span class="puss-btn" data-pv="user" style="cursor:pointer">User modal</span>
    <span class="puss-btn" data-pv="help" style="cursor:pointer">Help</span>
    <span class="puss-btn" data-pv="diag" style="cursor:pointer">Diagnostics</span>
    <span class="puss-btn" data-pv="compat" style="cursor:pointer">Compatibility</span>
</div>
<div class="puss-panel-frame" id="puss-stage"></div>
<div class="puss-preview-log" id="puss-log"></div>

<!-- ======== Panel (settings) ======== -->
<template id="puss-tpl-panel">
<div class="puss">
    <div class="puss-section" data-section="general">
        <h3 class="puss-section-title" data-i18n="general"></h3>
        <label class="puss-row">
            <span class="puss-row-label" data-i18n="enabled"></span>
            <span class="puss-switch">
                <input type="checkbox" class="puss-switch-input" data-action="toggle" data-path="global.enabled">
                <span class="puss-switch-slider"></span>
            </span>
        </label>
        <div class="puss-field">
            <div class="puss-field-head">
                <span class="puss-field-label" data-i18n="globalVolume"></span>
                <span class="puss-range-value" data-label-for="global.volume"></span>
            </div>
            <input type="range" class="puss-range" min="0" max="100" step="1" data-action="range" data-path="global.volume">
        </div>
        <div class="puss-field">
            <div class="puss-field-head">
                <span class="puss-field-label" data-i18n="messageBehavior"></span>
            </div>
            <select class="puss-select" data-action="select" data-path="global.messageScope">
                <option value="follow_discord" data-i18n="follow_discord"></option>
                <option value="direct_messages" data-i18n="direct_messages"></option>
                <option value="all_messages" data-i18n="all_messages"></option>
            </select>
        </div>
        <div class="puss-field">
            <div class="puss-field-head">
                <span class="puss-field-label" data-i18n="messageCooldown"></span>
            </div>
            <input type="number" class="puss-input puss-input-number" min="0" step="100" data-action="num" data-path="global.messageCooldownMs">
        </div>
        <label class="puss-row">
            <span class="puss-row-label" data-i18n="respectDnd"></span>
            <span class="puss-switch">
                <input type="checkbox" class="puss-switch-input" data-action="toggle" data-path="global.respectDnd">
                <span class="puss-switch-slider"></span>
            </span>
        </label>
        <label class="puss-row">
            <span class="puss-row-label" data-i18n="respectStreamerMode"></span>
            <span class="puss-switch">
                <input type="checkbox" class="puss-switch-input" data-action="toggle" data-path="global.respectStreamerMode">
                <span class="puss-switch-slider"></span>
            </span>
        </label>
        <label class="puss-row">
            <span class="puss-row-label" data-i18n="playInFocusedChannel"></span>
            <span class="puss-switch">
                <input type="checkbox" class="puss-switch-input" data-action="toggle" data-path="global.playInFocusedChannel">
                <span class="puss-switch-slider"></span>
            </span>
        </label>
        <label class="puss-row">
            <span class="puss-row-label" data-i18n="replaceNativeSounds"></span>
            <span class="puss-switch">
                <input type="checkbox" class="puss-switch-input" data-action="toggle" data-path="global.replaceNativeSounds">
                <span class="puss-switch-slider"></span>
            </span>
        </label>
        <label class="puss-row">
            <span class="puss-row-label" data-i18n="debug"></span>
            <span class="puss-switch">
                <input type="checkbox" class="puss-switch-input" data-action="toggle" data-path="global.debug">
                <span class="puss-switch-slider"></span>
            </span>
        </label>
        <div style="margin-top:12px">
            <button type="button" class="puss-btn puss-btn-secondary" data-action="compat">
                <span data-i18n="checkCompatibility"></span>
            </button>
        </div>
    </div>

    <div class="puss-section" data-section="defaults">
        <h3 class="puss-section-title" data-i18n="globalEvents"></h3>

    function detectLocale() {
        try {
            if (typeof BdApi !== "undefined" && BdApi && BdApi.LocaleManager && typeof BdApi.LocaleManager.getLocale === "function") {
                var l = BdApi.LocaleManager.getLocale();
                if (String(l).toLowerCase().indexOf("ru") === 0) return "ru";
                return "en";
            }
        }
        catch (_) { /* fall through */ }
        var lang = (typeof navigator !== "undefined" && navigator && navigator.language) || "en";
        return String(lang).toLowerCase().indexOf("ru") === 0 ? "ru" : "en";
    }

    function deepClone(value) {
        if (value === null || typeof value !== "object") return value;
        if (Array.isArray(value)) return value.map(deepClone);
        var out = {};
        for (var key in value) {
            if (Object.prototype.hasOwnProperty.call(value, key)) out[key] = deepClone(value[key]);
        }
        return out;
    }

    function clampNum(value, min, max) {
        var n = Number(value);
        if (!Number.isFinite(n)) return min;
        return Math.min(max, Math.max(min, n));
    }

    function setPath(obj, path, value) {
        var parts = String(path).split(".");
        var cursor = obj;
        for (var i = 0; i < parts.length - 1; i++) {
            if (cursor[parts[i]] === null || typeof cursor[parts[i]] !== "object") cursor[parts[i]] = {};
            cursor = cursor[parts[i]];
        }
        cursor[parts[parts.length - 1]] = value;
    }

    function getPath(obj, path) {
        var parts = String(path).split(".");
        var cursor = obj;
        for (var i = 0; i < parts.length; i++) {
            if (cursor === null || typeof cursor !== "object") return undefined;
            cursor = cursor[parts[i]];
        }
        return cursor;
    }

    function isInDiscord() {
        return typeof BdApi !== "undefined";
    }

    /* ============================ PussUI ============================ */
    function PussUI(options) {
        options = options || {};
        this.host = options.host || null;

    PussUI.prototype.text = function (key) {
        if (!key) return "";

        if (dict[key] !== undefined && dict[key] !== null) return dict[key];

    PussUI.prototype.tpl = function (id) {

        if (html) template.innerHTML = html;
        return template.content.cloneNode(true);
    };

    PussUI.prototype.applyI18n = function (root) {
        if (!root || !root.querySelectorAll) return;
        var self = this;
        var nodes = root.querySelectorAll("[data-i18n]");
        for (var i = 0; i < nodes.length; i++) {
            var node = nodes[i];
            if (node.childNodes.length === 0) node.textContent = self.text(node.getAttribute("data-i18n"));
        }
        var titleNodes = root.querySelectorAll("[data-i18n-title]");
        for (var j = 0; j < titleNodes.length; j++) {
            titleNodes[j].setAttribute("title", self.text(titleNodes[j].getAttribute("data-i18n-title")));
            titleNodes[j].setAttribute("aria-label", self.text(titleNodes[j].getAttribute("data-i18n-title")));
        }
    };

    PussUI.prototype.rangeVisual = function (input) {
        var min = Number(input.min) || 0;
        var max = Number(input.max) || 100;
        var value = clampNum(input.value, min, max);
        var percent = max > min ? ((value - min) / (max - min)) * 100 : 0;
        var accent = "var(--brand-experiment, #5865f2)";
        var track = "var(--puss-track, rgba(255,255,255,.08))";
        input.style.background = "linear-gradient(to right, " + accent + " 0%, " + accent + " " + percent + "%, " + track + " " + percent + "%, " + track + " 100%)";
    };

    /* ---------- panel ---------- */
    PussUI.prototype.mountPanel = function (container) {
        if (!container) return;
        this.panelContainer = container;
        if (this.host && this.host.getSettings) {
            try {
                this.panelSettings = this.host.getSettings();
            }
            catch (error) {
                this.panelSettings = this.panelSettings || null;
            }
        }
        this.attachPanelEvents(container);
        this.renderPanel();
    };

    PussUI.prototype.unmountPanel = function () {
        if (this.panelContainer) {
            this.panelContainer.replaceChildren();
        }

        this.panelSettings = null;
    };

    PussUI.prototype.renderPanel = function () {
        if (!this.panelContainer) return;
        var root = this.tpl("panel");
        this.applyI18n(root);
        var settings = this.panelSettings || {};
        // global controls
        var self = this;
        var toggles = root.querySelectorAll('[data-action="toggle"]');
        for (var i = 0; i < toggles.length; i++) {
            toggles[i].checked = Boolean(getPath(settings, toggles[i].getAttribute("data-path")));
        }
        var ranges = root.querySelectorAll('[data-action="range"]');
        for (var r = 0; r < ranges.length; r++) {
            var path = ranges[r].getAttribute("data-path");
            var value = clampNum(getPath(settings, path), 0, 1);
            ranges[r].value = String(Math.round(value * 100));
            self.rangeVisual(ranges[r]);
            var label = root.querySelector('[data-label-for="' + path + '"]');
            if (label) label.textContent = Math.round(value * 100) + "%";
        }
        var selects = root.querySelectorAll('[data-action="select"]');
        for (var s = 0; s < selects.length; s++) {
            selects[s].value = String(getPath(settings, selects[s].getAttribute("data-path")) || "");
        }
        var nums = root.querySelectorAll('[data-action="num"]');
        for (var n = 0; n < nums.length; n++) {
            nums[n].value = String(Number(getPath(settings, nums[n].getAttribute("data-path"))) || 0);
        }
        // global event defaults cards
        var defaultsBox = root.querySelector('[data-role="default-events"]');
        if (defaultsBox) {
            for (var e = 0; e < PUSS_EVENTS.length; e++) {

                var card = this.buildEventCard(eventType, (settings.defaults || {})[eventType] || {}, {allowInherit: false, scope: "panel-defaults"});

        this.panelContainer.replaceChildren(root);
    };

    PussUI.prototype.fillUsersInto = function (usersBox) {
        if (!usersBox) return;
        usersBox.replaceChildren();
        var settings = this.panelSettings || {};
        var entries = [];
        var users = settings.users || {};
        for (var key in users) {
            if (Object.prototype.hasOwnProperty.call(users, key)) entries.push([key, users[key]]);
        }
        if (!entries.length) {
            var empty = document.createElement("div");
            empty.className = "puss-empty";
            empty.textContent = this.text("emptyUsers");
            usersBox.appendChild(empty);
            return;
        }
        var self = this;
        for (var i = 0; i < entries.length; i++) {
            var userId = entries[i][0];
            var entry = entries[i][1] || {};
            var row = this.tpl("user-row");
            this.applyI18n(row);
            row.querySelector(".puss-user").setAttribute("data-user", userId);
            var identity = entry.identity || {};
            var live = null;
            if (self.host && self.host.resolveUser) {
                try { live = self.host.resolveUser(userId); } catch (_) { live = null; }
            }
            var avatar = row.querySelector('[data-role="avatar"]');
            if (avatar) {
                var avatarUrl = identity.avatar || (live && live.avatar) || "";
                if (avatarUrl) { avatar.src = avatarUrl; avatar.removeAttribute("hidden"); }
                else avatar.style.visibility = "hidden";
            }
            var nameEl = row.querySelector('[data-role="name"]');
            if (nameEl) nameEl.textContent = self.displayName(identity, live, userId);
            var idEl = row.querySelector('[data-role="id"]');
            if (idEl) idEl.textContent = userId;
            var summary = row.querySelector('[data-role="summary"]');
            if (summary) {
                var parts = [];
                for (var e = 0; e < PUSS_EVENTS.length; e++) {
                    var et = PUSS_EVENTS[e];
                    parts.push(self.text(et) + ": " + self.text((entry[et] && entry[et].mode) || "inherit"));
                }
                summary.textContent = parts.join("  |  ");
            }
            usersBox.appendChild(row);
        }
    };

    PussUI.prototype.rerenderUsers = function () {
        if (!this.panelContainer) return;
        var box = this.panelContainer.querySelector('[data-role="users"]');
        if (box) this.fillUsersInto(box);
    };

    PussUI.prototype.displayName = function (identity, live, fallback) {
        var name = (identity && (identity.globalName || identity.username)) || (live && (live.globalName || live.username)) || fallback;
        return name || "";
    };

    /* build one event editor card; config is the sound config object */
    PussUI.prototype.buildEventCard = function (eventType, config, opts) {
        opts = opts || {};
        var card = this.tpl("event-card");
        this.applyI18n(card);
        var rootEl = card.querySelector(".puss-card");
        rootEl.setAttribute("data-event", eventType);
        var title = card.querySelector(".puss-card-title");
        if (title) title.textContent = this.text(eventType);
        var modeBtns = card.querySelectorAll('.puss-mode-btn');
        var mode = config.mode || (opts.allowInherit ? "inherit" : "default");
        for (var bi = 0; bi < modeBtns.length; bi++) {
            var b = modeBtns[bi];
            if (!opts.allowInherit && b.getAttribute("data-mode") === "inherit") b.style.display = "none";
            if (b.getAttribute("data-mode") === mode) b.classList.add("active");
        }
        var pathInput = card.querySelector('[data-field="path"]');
        if (pathInput) {
            pathInput.value = config.path || "";
            if (config.path) pathInput.title = config.path;
        }
        var volumeRange = card.querySelector('[data-field="volume"]');
        var volumeLabel = card.querySelector('[data-field="volume-label"]');
        var volume = clampNum(config.volume == null ? 1 : config.volume, 0, 1);
        if (volumeRange) {
            volumeRange.value = String(Math.round(volume * 100));
            this.rangeVisual(volumeRange);
        }
        if (volumeLabel) volumeLabel.textContent = Math.round(volume * 100) + "%";
        return card;
    };

    /* reflect the active mode on the card's mode buttons */
    PussUI.prototype.syncModeButtons = function (card, mode) {
        if (!card) return;
        var btns = card.querySelectorAll(".puss-mode-btn");
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle("active", btns[i].getAttribute("data-mode") === mode);
        }
    };

    /* ---------- panel event delegation ---------- */
    PussUI.prototype.attachPanelEvents = function (container) {
        if (container.__pussBound) return;
        container.__pussBound = true;
        var self = this;
        container.addEventListener("input", function (event) {
            var el = event.target && event.target.closest ? event.target.closest("[data-action]") : null;
            if (!el) return;
            var action = el.getAttribute("data-action");
            if (action === "range") self.panelRangeInput(el);
            else if (action === "range-field") self.cardRangeInput(el, "panel-defaults");

        },
        users: {
            "112233445566778899": {
                identity: {username: "alice", globalName: "Alice", avatar: null},
                message: {mode: "custom", path: "C:\\sounds\\alice-msg.mp3", source: null, volume: 0.7},
                incomingCall: {mode: "inherit", path: null, source: null, volume: 1},
                disconnect: {mode: "silent", path: null, source: null, volume: 1},
                voiceJoin: {mode: "inherit", path: null, source: null, volume: 1}
            },
            "998877665544332211": {
                identity: {username: "bob", globalName: "Bob", avatar: null},
                message: {mode: "inherit", path: null, source: null, volume: 1},
                incomingCall: {mode: "default", path: null, source: null, volume: 1},
                disconnect: {mode: "inherit", path: null, source: null, volume: 1},
                voiceJoin: {mode: "inherit", path: null, source: null, volume: 1}
            }
        }
    };

    var state = clone(demo);
    var ui = null;
    var stage = document.getElementById("puss-stage");

    function collectTemplates() {
        var templates = {};
        var ids = ["panel", "event-card", "user-row", "user-modal", "help", "help-row", "diagnostics", "diag-row", "compatibility", "compat-row"];
        for (var i = 0; i < ids.length; i++) {
            var node = document.getElementById("puss-tpl-" + ids[i]);
            templates[ids[i]] = node ? node.innerHTML : "";
        }
        return templates;
    }

    function logLine() {
        var args = Array.prototype.slice.call(arguments);
        var el = document.getElementById("puss-log");
        if (!el) return;
        el.textContent += "› " + args.map(function (a) { return typeof a === "string" ? a : JSON.stringify(a); }).join(" ") + "\n";
        el.scrollTop = el.scrollHeight;
    }

    function mockHost() {
        return {
            getSettings: function () { return clone(state); },
            commitSettings: function (next) { state = clone(next); logLine("commitSettings"); },
            resolveUser: function (userId) {
                if (userId === "112233445566778899") return {id: userId, username: "alice", globalName: "Alice", avatar: ""};
                if (userId === "998877665544332211") return {id: userId, username: "bob", globalName: "Bob", avatar: ""};
                if (userId === "555000111222333444") return {id: userId, username: "carol", globalName: "Carol", avatar: ""};
                return null;
            },
            pickAudioFile: function () { logLine("pickAudioFile (mock)"); return Promise.resolve({path: "C:\\mock\\picked-file.mp3", source: null}); },
            preview: function (config) { logLine("preview", config && config.path); },
            stopPreview: function () { logLine("stopPreview"); },
            diagnose: function (config) { logLine("diagnose", config && config.path); },
            saveUserDraft: function (userId, draft) {
                state.users[userId] = clone(draft);
                logLine("saveUserDraft", userId);
                ui.rerenderUsers();
            },
            removeUser: function (userId) { delete state.users[userId]; logLine("removeUser", userId); },
            resetUser: function (userId) { delete state.users[userId]; logLine("resetUser", userId); },
            addUserById: function (userId) {
                if (userId !== "555000111222333444") return {error: "userNotFound"};
                var live = this.resolveUser(userId);
                state.users[userId] = {
                    identity: {username: live.username, globalName: live.globalName, avatar: null},
                    message: {mode: "inherit", path: null, source: null, volume: 1},
                    incomingCall: {mode: "inherit", path: null, source: null, volume: 1},
                    disconnect: {mode: "inherit", path: null, source: null, volume: 1},
                    voiceJoin: {mode: "inherit", path: null, source: null, volume: 1}
                };
                logLine("addUserById", userId);
                return {ok: true};
            },
            toast: function (message, type) { logLine("toast(" + (type || "info") + ")", message); },
            fileExists: function (path) { return Boolean(path); },
            identityName: function (identity, fallback) {
                return (identity && (identity.globalName || identity.username)) || fallback;
            }
        };
    }

    function boot() {
        var styles = document.getElementById("puss-styles");
        ui = new window.PussUI({
            host: mockHost(),
            styles: styles ? styles.textContent : "",
            templates: collectTemplates()
        });
        ui.mountPanel(stage);
        logLine("PussUI booted in preview mode (mock). Host: mockHost.");
    }

    document.getElementById("puss-toolbar").addEventListener("click", function (event) {
        var el = event.target.closest ? event.target.closest("[data-pv]") : null;
        if (!el) return;
        var action = el.getAttribute("data-pv");
        if (action === "locale-ru") { ui.setLocale("ru"); logLine("locale: ru"); }
        else if (action === "locale-en") { ui.setLocale("en"); logLine("locale: en"); }
        else if (action === "theme") {
            var current = document.documentElement.getAttribute("data-puss-preview");
            var next = current === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-puss-preview", next);
            logLine("theme: " + next);
        }
        else if (action === "open-panel") { ui.mountPanel(stage); }
        else if (action === "user") { ui.openUserModalFor("112233445566778899"); }
        else if (action === "help") { ui.openHelp(); }
        else if (action === "diag") {
            ui.openDiagnostics("C:\\sounds\\problem-file.mp3", [
                ["path", "C:\\sounds\\problem-file.mp3"], ["hasDataSource", "false"],
                ["exists", "true"], ["size", "512032"], ["mime", "audio/mpeg"],
                ["canPlayType", "maybe"], ["urlType", "data:audio/mpeg;base64,…"],
                ["htmlAudioLoad", "ok"], ["audioContext", "running"],
                ["webAudioDecode", "failed"], ["webAudioError", "EncodingError: Unable to decode audio data"]
            ]);
        }
        else if (action === "compat") {
            ui.openCompatibility([
                ["Dispatcher", true], ["SoundUtils", true], ["DesktopNotification", true],
                ["CallStore", true], ["VoiceStateStore", true], ["Context menu patch", true],
                ["Sound prototype patch", false], ["Active unpatches", false]
            ]);
        }
    });

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
    }
    else {
        boot();
    }
})();
</script>
</body>
</html>
